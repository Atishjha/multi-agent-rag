<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG Analytics</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff; --bg-secondary: #f7f7f5; --bg-tertiary: #f0efe9;
    --text: #1a1a1a; --text-secondary: #6b6b6b; --text-tertiary: #9b9b9b;
    --border: rgba(0,0,0,0.12); --border-strong: rgba(0,0,0,0.25);
    --purple: #534AB7; --purple-bg: #EEEDFE; --purple-text: #26215C;
    --teal: #1D9E75; --teal-bg: #E1F5EE; --teal-text: #085041;
    --amber: #BA7517; --amber-bg: #FAEEDA; --amber-text: #412402;
    --coral: #993C1D; --coral-bg: #FAECE7; --coral-text: #4A1B0C;
    --radius-md: 8px; --radius-lg: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1c; --bg-secondary: #242424; --bg-tertiary: #2c2c2a;
      --text: #f0efe9; --text-secondary: #a0a09a; --text-tertiary: #6b6b68;
      --border: rgba(255,255,255,0.1); --border-strong: rgba(255,255,255,0.22);
      --purple-bg: #26215C; --purple-text: #CECBF6;
      --teal-bg: #04342C; --teal-text: #9FE1CB;
      --amber-bg: #412402; --amber-text: #FAC775;
      --coral-bg: #4A1B0C; --coral-text: #F5C4B3;
    }
  }
  html, body { min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg-tertiary); color: var(--text); font-size: 15px; }
  .page { max-width: 900px; margin: 0 auto; padding: 32px 20px; }
  .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
  .page-header h1 { font-size: 20px; font-weight: 500; }
  .page-header p  { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
  .nav-links { display: flex; gap: 8px; }
  .nav-links a { font-size: 13px; padding: 6px 14px; border-radius: var(--radius-md); border: 0.5px solid var(--border-strong); color: var(--text-secondary); text-decoration: none; }
  .nav-links a:hover { background: var(--bg-secondary); }
  .nav-links a.active { background: var(--purple-bg); color: var(--purple-text); border-color: transparent; }

  .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .metric { background: var(--bg-secondary); border-radius: var(--radius-md); padding: 14px 16px; }
  .metric-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
  .metric-val   { font-size: 28px; font-weight: 500; line-height: 1; }
  .metric-sub   { font-size: 11px; color: var(--text-tertiary); margin-top: 4px; }
  .metric-val.purple { color: var(--purple); }
  .metric-val.teal   { color: var(--teal); }
  .metric-val.amber  { color: var(--amber); }
  .metric-val.coral  { color: var(--coral); }

  .section { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 16px; }
  .section-title { font-size: 14px; font-weight: 500; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .section-title svg { width: 15px; height: 15px; stroke: var(--text-secondary); fill: none; stroke-width: 1.8; flex-shrink: 0; }

  .bar-chart { display: flex; flex-direction: column; gap: 10px; }
  .bar-row { display: grid; grid-template-columns: 160px 1fr 48px; align-items: center; gap: 10px; }
  .bar-label { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { height: 8px; background: var(--bg-secondary); border-radius: 4px; overflow: hidden; }
  .bar-fill  { height: 8px; border-radius: 4px; background: var(--purple); transition: width 0.5s ease; }
  .bar-fill.teal { background: var(--teal); }
  .bar-val { font-size: 12px; font-weight: 500; color: var(--text); text-align: right; }

  .time-chart { display: flex; align-items: flex-end; gap: 4px; height: 80px; }
  .time-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; height: 100%; justify-content: flex-end; }
  .time-bar { width: 100%; border-radius: 3px 3px 0 0; background: var(--purple-bg); min-height: 4px; transition: height 0.4s ease; position: relative; cursor: default; }
  .time-bar:hover { background: var(--purple); }
  .time-bar:hover::after { content: attr(data-tip); position: absolute; bottom: 110%; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); font-size: 10px; padding: 3px 6px; border-radius: 4px; white-space: nowrap; z-index: 10; }
  .time-tick { font-size: 9px; color: var(--text-tertiary); }

  .logs-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .logs-table th { text-align: left; font-size: 11px; font-weight: 500; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; padding: 0 8px 10px; border-bottom: 0.5px solid var(--border); }
  .logs-table td { padding: 10px 8px; border-bottom: 0.5px solid var(--border); color: var(--text); vertical-align: top; }
  .logs-table tr:last-child td { border-bottom: none; }
  .logs-table tr:hover td { background: var(--bg-secondary); }
  .q-text { max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  .pill { display: inline-block; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 20px; }
  .pill.fast   { background: var(--teal-bg);  color: var(--teal-text); }
  .pill.medium { background: var(--amber-bg); color: var(--amber-text); }
  .pill.slow   { background: var(--coral-bg); color: var(--coral-text); }

  .empty { text-align: center; padding: 40px 20px; color: var(--text-tertiary); font-size: 13px; }
  .btn-clear { font-size: 12px; padding: 5px 12px; border-radius: var(--radius-md); border: 0.5px solid var(--border-strong); background: transparent; color: var(--coral); cursor: pointer; }
  .btn-clear:hover { background: var(--coral-bg); }
  .btn-refresh { font-size: 12px; padding: 5px 12px; border-radius: var(--radius-md); border: 0.5px solid var(--border-strong); background: transparent; color: var(--text-secondary); cursor: pointer; }
  .btn-refresh:hover { background: var(--bg-secondary); }
  .header-actions { display: flex; gap: 8px; align-items: center; }
  .loading { text-align: center; padding: 24px; color: var(--text-tertiary); font-size: 13px; }
</style>
</head>
<body>
<div class="page">
  <div class="page-header">
    <div>
      <h1>RAG analytics</h1>
      <p id="subtitle">Loading...</p>
    </div>
    <div class="nav-links">
      <a href="/">Chat</a>
      <a href="/analytics.html" class="active">Analytics</a>
    </div>
  </div>

  <div class="metrics-grid" id="metrics-grid">
    <div class="metric"><div class="metric-label">Total queries</div><div class="metric-val purple" id="m-total">—</div></div>
    <div class="metric"><div class="metric-label">Avg response time</div><div class="metric-val teal" id="m-avg-time">—</div><div class="metric-sub" id="m-p90">p90: —</div></div>
    <div class="metric"><div class="metric-label">Avg chunks used</div><div class="metric-val amber" id="m-avg-used">—</div><div class="metric-sub" id="m-avg-retrieved">of — retrieved</div></div>
    <div class="metric"><div class="metric-label">Avg filter rate</div><div class="metric-val coral" id="m-filter">—</div><div class="metric-sub">chunks filtered out</div></div>
  </div>

  <div class="section">
    <div class="section-title">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      Top sources by query hits
    </div>
    <div class="bar-chart" id="sources-chart"><div class="loading">Loading...</div></div>
  </div>

  <div class="section">
    <div class="section-title">
      <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Response time — last 20 queries (seconds)
    </div>
    <div class="time-chart" id="time-chart"><div class="loading">Loading...</div></div>
  </div>

  <div class="section">
    <div class="section-title" style="justify-content: space-between;">
      <span style="display:flex;align-items:center;gap:8px;">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Recent queries
      </span>
      <div class="header-actions">
        <button class="btn-refresh" onclick="load()">Refresh</button>
        <button class="btn-clear" onclick="clearLogs()">Clear logs</button>
      </div>
    </div>
    <div id="logs-container"><div class="loading">Loading...</div></div>
  </div>
</div>

<script>
  const API = 'http://localhost:8000';

  async function load() {
    try {
      const [statsRes, logsRes] = await Promise.all([
        fetch(`${API}/stats`),
        fetch(`${API}/logs?limit=50`)
      ]);
      const stats = await statsRes.json();
      const logsData = await logsRes.json();
      render(stats, logsData);
    } catch(e) {
      document.getElementById('subtitle').textContent = 'Could not connect to server at localhost:8000';
    }
  }

  function render(stats, logsData) {
    if (!stats.total_queries) {
      document.getElementById('subtitle').textContent = 'No queries logged yet — ask something in the chat!';
      document.getElementById('sources-chart').innerHTML = '<div class="empty">No data yet.</div>';
      document.getElementById('time-chart').innerHTML = '<div class="empty">No data yet.</div>';
      document.getElementById('logs-container').innerHTML = '<div class="empty">No queries logged yet.</div>';
      ['m-total','m-avg-time','m-p90','m-avg-used','m-avg-retrieved','m-filter'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.textContent = '—';
      });
      return;
    }

    document.getElementById('subtitle').textContent =
      `Last updated ${new Date().toLocaleTimeString()} · ${stats.total_queries} total queries`;

    document.getElementById('m-total').textContent = stats.total_queries;
    document.getElementById('m-avg-time').textContent = stats.response_time.avg_seconds.toFixed(2) + 's';
    document.getElementById('m-p90').textContent = 'p90: ' + stats.response_time.p90_seconds.toFixed(2) + 's';
    document.getElementById('m-avg-used').textContent = stats.retrieval.avg_chunks_used.toFixed(1);
    document.getElementById('m-avg-retrieved').textContent = 'of ' + stats.retrieval.avg_chunks_retrieved.toFixed(1) + ' retrieved';
    document.getElementById('m-filter').textContent = stats.retrieval.avg_filter_rate_pct.toFixed(0) + '%';

    const topSources = stats.sources.top_sources ?? [];
    const maxHits = topSources.length ? topSources[0].hits : 1;
    const sc = document.getElementById('sources-chart');
    if (!topSources.length) {
      sc.innerHTML = '<div class="empty">No source data yet.</div>';
    } else {
      sc.innerHTML = topSources.map(s => `
        <div class="bar-row">
          <div class="bar-label" title="${s.source}">${s.source}</div>
          <div class="bar-track"><div class="bar-fill teal" style="width:${Math.round(s.hits/maxHits*100)}%"></div></div>
          <div class="bar-val">${s.hits}</div>
        </div>`).join('');
    }

    const allLogs = logsData.logs ?? [];
    const recent20 = allLogs.slice(0, 20).reverse();
    const tc = document.getElementById('time-chart');
    if (!recent20.length) {
      tc.innerHTML = '<div class="empty">No data yet.</div>';
    } else {
      const maxT = Math.max(...recent20.map(l => l.elapsed_seconds), 0.1);
      tc.innerHTML = recent20.map(l => {
        const pct = Math.round(l.elapsed_seconds / maxT * 100);
        const tip = `${l.elapsed_seconds.toFixed(2)}s`;
        return `<div class="time-bar-wrap">
          <div class="time-bar" style="height:${pct}%" data-tip="${tip}"></div>
          <div class="time-tick">${l.elapsed_seconds.toFixed(1)}</div>
        </div>`;
      }).join('');
    }

    const lc = document.getElementById('logs-container');
    if (!allLogs.length) {
      lc.innerHTML = '<div class="empty">No queries logged yet.</div>';
    } else {
      lc.innerHTML = `<table class="logs-table">
        <thead><tr>
          <th>#</th><th>Query</th><th>Time</th>
          <th>Retrieved</th><th>Used</th><th>Sources</th><th>When</th>
        </tr></thead>
        <tbody>${allLogs.map(l => {
          const speed = l.elapsed_seconds < 2 ? 'fast' : l.elapsed_seconds < 5 ? 'medium' : 'slow';
          const when = new Date(l.timestamp).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
          return `<tr>
            <td style="color:var(--text-tertiary)">${l.id}</td>
            <td><div class="q-text" title="${l.query}">${l.query}</div></td>
            <td><span class="pill ${speed}">${l.elapsed_seconds.toFixed(2)}s</span></td>
            <td style="color:var(--text-secondary)">${l.chunks_retrieved}</td>
            <td style="color:var(--teal);font-weight:500">${l.chunks_used}</td>
            <td style="color:var(--text-secondary)">${(l.sources??[]).length}</td>
            <td style="color:var(--text-tertiary);white-space:nowrap">${when}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>`;
    }
  }

  async function clearLogs() {
    if (!confirm('Clear all query logs? This cannot be undone.')) return;
    await fetch(`${API}/logs`, { method: 'DELETE' });
    load();
  }

  load();
  setInterval(load, 30000);
</script>
</body>
</html>
